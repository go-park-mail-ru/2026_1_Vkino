grpc:
  port: 9094

auth_grpc:
  address: "auth-service:9090"
  request_timeout: "5s"

user_grpc:
  address: "user-service:9091"
  request_timeout: "5s"

logger:
  level: "info"
  format: "json"
  output_path: "logs/app/payment.log"

metrics:
  enabled: true
  address: ":9200"

postgres:
  host: "db"
  port: 5432
  user: ""
  password: ""
  dbname: ""
  sslmode: "disable"
  application_name: "vkino-payment-service"
  max_pool_size: 10
  conn_attempts: 10
  conn_timeout: "5s"
  statement_timeout: "5s"
  lock_timeout: "1s"
  idle_in_transaction_session_timeout: "10s"

yookassa:
  api_url: "https://api.yookassa.ru/v3"
  shop_id: ""
  secret_key: ""
  return_url: "http://localhost:3000/payments/return"
  capture: true
  timeout: "30s"
