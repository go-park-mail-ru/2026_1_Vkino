syntax = "proto3";

package user.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_VKino/pkg/gen/user/v1;userv1";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetFriend(GetFriendRequest) returns (GetFriendResponse);
  rpc GetSubscriptionCapabilities(GetSubscriptionCapabilitiesRequest) returns (GetSubscriptionCapabilitiesResponse);
  rpc GetVKinoCoinsHistory(GetVKinoCoinsHistoryRequest) returns (GetVKinoCoinsHistoryResponse);
  rpc ActivateSubscription(ActivateSubscriptionRequest) returns (ActivateSubscriptionResponse);
  rpc BuySubscriptionWithVKinoCoins(BuySubscriptionWithVKinoCoinsRequest)
      returns (BuySubscriptionWithVKinoCoinsResponse);
  rpc SpendVKinoCoins(SpendVKinoCoinsRequest) returns (SpendVKinoCoinsResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc SearchUsersByEmail(SearchUsersByEmailRequest) returns (SearchUsersByEmailResponse);
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc DeleteFriend(DeleteFriendRequest) returns (DeleteFriendResponse);
  rpc AddMovieToFavorites(AddMovieToFavoritesRequest) returns (AddMovieToFavoritesResponse);
  rpc SetMovieRating(SetMovieRatingRequest) returns (SetMovieRatingResponse);
  rpc SetMovieReview(SetMovieReviewRequest) returns (SetMovieReviewResponse);
  rpc DeleteMovieReview(DeleteMovieReviewRequest) returns (DeleteMovieReviewResponse);
  rpc SetReviewReaction(SetReviewReactionRequest) returns (SetReviewReactionResponse);
  rpc DeleteReviewReaction(DeleteReviewReactionRequest) returns (DeleteReviewReactionResponse);
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteResponse);
  rpc GetFavorites(GetFavoritesRequest) returns (GetFavoritesResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  rpc RespondToFriendRequest(RespondToFriendRequestRequest) returns (RespondToFriendRequestResponse);
  rpc DeleteOutgoingFriendRequest(DeleteOutgoingFriendRequestRequest) returns (DeleteOutgoingFriendRequestResponse);
  rpc GetFriendRequests(GetFriendRequestsRequest) returns (GetFriendRequestsResponse);
  rpc GetFriendsList(GetFriendsListRequest) returns (GetFriendsListResponse);
}

message GetProfileRequest {
  int64 user_id = 1;
}

message GetProfileResponse {
  string email = 1;
  string birthdate = 2;
  string avatar_url = 3;
  string role = 4;
  int32 vkino_coins_balance = 5;
}

message GetFriendRequest {
  int64 friend_id = 1;
}

message GetFriendResponse {
  int64 id = 1;
  string email = 2;
  string avatar_url = 3;
}

message GetSubscriptionCapabilitiesRequest {
  int64 user_id = 1;
}

message SubscriptionInfo {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int32 level = 4;
  optional string active_until = 5;
}

message SubscriptionCapabilities {
  bool can_watch_paid_content = 1;
  bool can_use_smart_continue = 2;
  string ad_policy = 3;
  int32 daily_coins_limit = 4;
  optional int32 monthly_room_limit = 5;
  int32 max_room_members = 6;
}

message SubscriptionUsage {
  int32 coins_received_today = 1;
  int32 coins_remaining_today = 2;
  int32 rooms_created_this_month = 3;
  optional int32 rooms_remaining_this_month = 4;
}

message GetSubscriptionCapabilitiesResponse {
  SubscriptionInfo subscription = 1;
  SubscriptionCapabilities capabilities = 2;
  SubscriptionUsage usage = 3;
}

message GetVKinoCoinsHistoryRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message VKinoCoinsHistoryItem {
  int64 id = 1;
  int32 vkino_coins_count = 2;
  string operation_type = 3;
  string description = 4;
  string created_at = 5;
}

message GetVKinoCoinsHistoryResponse {
  repeated VKinoCoinsHistoryItem items = 1;
  int32 total_count = 2;
}

message ActivateSubscriptionRequest {
  int64 user_id = 1;
  int64 tariff_id = 2;
  int64 payment_id = 3;
}

message ActivateSubscriptionResponse {
  SubscriptionInfo subscription = 1;
}

message BuySubscriptionWithVKinoCoinsRequest {
  int64 user_id = 1;
  int64 tariff_id = 2;
}

message BuySubscriptionWithVKinoCoinsResponse {
  int64 payment_id = 1;
  int32 coins_spent = 2;
  int32 vkino_coins_balance = 3;
  SubscriptionInfo subscription = 4;
}

message SpendVKinoCoinsRequest {
  int64 user_id = 1;
  int32 coins_amount = 2;
  string operation_type = 3;
  string description = 4;
}

message SpendVKinoCoinsResponse {
  int32 coins_spent = 1;
  int32 vkino_coins_balance = 2;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  string birthdate = 2;
  bytes avatar = 3;
  string avatar_content_type = 4;
}

message UpdateProfileResponse {
  string email = 1;
  string birthdate = 2;
  string avatar_url = 3;
}

message SearchUsersByEmailRequest {
  int64 user_id = 1;
  string email_query = 2;
}

message UserSearchResult {
  int64 id = 1;
  string email = 2;
  string avatar_url = 3;
  bool is_friend = 4;
}

message SearchUsersByEmailResponse {
  repeated UserSearchResult users = 1;
}

message AddFriendRequest {
  int64 user_id = 1;
  int64 friend_id = 2;
}

message AddFriendResponse {
  int64 id = 1;
  string email = 2;
  string avatar_url = 3;
}

message DeleteFriendRequest {
  int64 user_id = 1;
  int64 friend_id = 2;
}

message DeleteFriendResponse {
  bool success = 1;
}

message AddMovieToFavoritesRequest {
  int64 user_id = 1;
  int64 movie_id = 2;
}

message AddMovieToFavoritesResponse {
  int64 movie_id = 1;
  bool is_favorite = 2;
}

message SetMovieRatingRequest {
  int64 movie_id = 1;
  double rating = 2;
}

message SetMovieRatingResponse {
  int64 movie_id = 1;
  double rating = 2;
}

message SetMovieReviewRequest {
  int64 movie_id = 1;
  optional double rating = 2;
  optional string comment = 3;
}

message SetMovieReviewResponse {
  int64 review_id = 1;
  int64 movie_id = 2;
  optional double rating = 3;
  optional string comment = 4;
}

message DeleteMovieReviewRequest {
  int64 movie_id = 1;
}

message DeleteMovieReviewResponse {
  bool success = 1;
}

message SetReviewReactionRequest {
  int64 review_id = 1;
  string reaction = 2;
}

message SetReviewReactionResponse {
  int64 review_id = 1;
  string reaction = 2;
}

message DeleteReviewReactionRequest {
  int64 review_id = 1;
}

message DeleteReviewReactionResponse {
  bool success = 1;
}

message ToggleFavoriteRequest {
  int64 movie_id = 1;
}

message ToggleFavoriteResponse {
  int64 movie_id = 1;
  bool is_favorite = 2;
}

message GetFavoritesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetFavoritesResponse {
  repeated int64 movie_ids = 1;
  int32 total_count = 2;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchUsersResponse {
  repeated UserSearchResult users = 1;
}

message SendFriendRequestRequest {
  int64 to_user_id = 1;
}

message SendFriendRequestResponse {
  int64 request_id = 1;
}

message RespondToFriendRequestRequest {
  int64 request_id = 1;
  string action = 2;
}

message RespondToFriendRequestResponse {
  bool success = 1;
}

message DeleteOutgoingFriendRequestRequest {
  int64 request_id = 1;
}

message DeleteOutgoingFriendRequestResponse {
  bool success = 1;
}

message GetFriendRequestsRequest {
  string direction = 1;
  int32 limit = 2;
}

message FriendRequestItem {
  int64 id = 1;
  int64 user_id = 2;
  string email = 3;
  string created_at = 4;
}

message GetFriendRequestsResponse {
  repeated FriendRequestItem requests = 1;
}

message GetFriendsListRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetFriendsListResponse {
  repeated UserSearchResult friends = 1;
  int32 total_count = 2;
}
